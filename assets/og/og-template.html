<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../style.css">
<style>
  html,body{margin:0;background:#F6F3EC}
  body::after{display:none}
  .og{position:relative;width:1200px;height:630px;overflow:hidden;
    background:linear-gradient(160deg,#F6F3EC 0%,#E9E6E0 40%,#DCEAF7 78%,#BFD9F2 100%)}
  .og .disc{position:absolute;right:150px;top:40px;width:420px;height:420px;border-radius:50%;
    background:radial-gradient(circle at 40% 35%,#E8F1FA,#BFD9F2 60%,#A9CBEC)}
  .og .art{position:absolute;right:90px;bottom:-10px;width:470px}
  .og .eyebrow{position:absolute;left:80px;top:90px;margin:0}
  .og h1{position:absolute;left:80px;bottom:130px;margin:0;font:400 150px/.88 var(--display);letter-spacing:-.035em;color:#14161C}
  .og h1 em{font-style:italic;font-weight:300}
  .og .url{position:absolute;left:80px;bottom:60px;font:500 16px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:#3A3D46}
  .icon{width:512px;height:512px;border-radius:112px;background:#F6F3EC;display:grid;place-items:center;position:relative;overflow:hidden}
  .icon span{font:500 270px/1 var(--display);letter-spacing:-.04em;color:#14161C}
  .icon i{position:absolute;right:64px;top:64px;width:72px;height:72px;border-radius:50%;background:#BFD9F2}
</style></head>
<body>
<div class="og" id="og">
  <div class="disc"></div>
  <img class="art" src="../img/art/bust-profile.svg" alt="">
  <p class="eyebrow">Unternehmer · Gründer</p>
  <h1>Filip <em>Kramar</em></h1>
  <p class="url">filipkramar.de</p>
</div>
<div class="icon" id="icon"><span>FK</span><i></i></div>
</body></html>
