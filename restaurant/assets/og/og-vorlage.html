<!DOCTYPE html>
<!-- Vorlage für assets/img/og-image.jpg (1200×630). Lokal über einen Server öffnen und das Element #og als Bild exportieren (siehe README). -->
<html lang="de"><head><meta charset="utf-8"><title>OG-Vorlage</title><style>
@font-face{font-family:'Fraunces';font-weight:300 700;src:url(../fonts/fraunces-latin.woff2)}
@font-face{font-family:'Fraunces';font-style:italic;font-weight:300 700;src:url(../fonts/fraunces-italic-latin.woff2)}
@font-face{font-family:'Inter';font-weight:400 600;src:url(../fonts/inter-latin.woff2)}
body{margin:0}
#og{position:relative;width:1200px;height:630px;overflow:hidden;background:#0B0908;color:#FBF4EA;font-family:Inter}
#og img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#og .weich{opacity:.55}
#og .shade{position:absolute;inset:0;background:radial-gradient(120% 90% at 25% 65%,rgba(9,7,6,.2),rgba(9,7,6,.7)),linear-gradient(180deg,rgba(9,7,6,.35),rgba(9,7,6,.1) 40%,rgba(9,7,6,.85))}
#og .txt{position:absolute;left:72px;right:72px;bottom:64px}
#og .eye{font:500 18px/1 Inter;letter-spacing:.2em;text-transform:uppercase;opacity:.85;margin-bottom:22px}
#og h1{margin:0;font:360 150px/.86 Fraunces;letter-spacing:-.035em}
#og em{font-style:italic;font-weight:300;color:#F29A62}
#og p{margin:28px 0 0;font:400 28px/1.35 Inter;opacity:.9}
</style></head><body><div id="og">
<img src="../img/hero/innen-1400.webp"><img class="weich" src="../img/hero/innen-weich.webp">
<div class="shade"></div>
<div class="txt"><div class="eye">Restaurant &amp; Bar · Altstadt</div><h1>Salz <em>&amp;</em> Glut</h1><p>Saisonale Küche über offenem Feuer.</p></div>
</div></body></html>
